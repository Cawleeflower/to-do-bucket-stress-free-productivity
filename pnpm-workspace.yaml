blockExoticSubdeps: true
trustPolicy: no-downgrade
# Known trust downgrades, reviewed and allowed. Pinned to exact versions so newer releases are still checked.
trustPolicyExclude:
  - lefthook@2.2.2
  - semver@6.3.1
packages:
  - "apps/*"
  - "packages/*"

# Don't install a version until it is 7 days old (same as the Dependabot cooldown).
minimumReleaseAge: 10080

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true
  workerd: true
  lefthook: false
