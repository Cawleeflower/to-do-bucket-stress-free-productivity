pre-commit:
  commands:
    biome:
      glob: "*.{js,cjs,mjs,ts,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --verbose

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}
